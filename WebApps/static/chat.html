<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>ABC123 Restaurant — AI Review Assistant</title>
<!-- Bootstrap from a CDN: gives us ready-made styling (navbar, cards, buttons…).
     The browser needs internet to download it. -->
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
<style>
    /* Minimal custom CSS — everything else uses Bootstrap utilities/components. */
    .message { max-width: 80%; white-space: pre-wrap; word-wrap: break-word; }
    /* .message wraps long text and keeps line breaks, like a real chat app. */
    /* Styles for markdown rendered inside bot bubbles (marked -> DOMPurify -> innerHTML). */
    .message strong { font-weight: 700; }           /* **bold** */
    .message p { margin-bottom: .4rem; }            /* paragraphs stay compact */
    .message ul, .message ol { margin-bottom: .4rem; padding-left: 1.2rem; }  /* lists indent nicely */
    .message code { background: #e9ecef; padding: .1rem .3rem; border-radius: .25rem; }  /* `inline code` */
</style>
</head>
<body class="bg-light">

<div class="container py-4">
    <div class="row justify-content-center">
        <div class="col-lg-8">

            <!-- Error banner: alert = colored box, danger = red, d-none = hidden
                 (the JavaScript removes d-none to show it). -->
            <div class="alert alert-danger d-none" id="errorBanner" role="alert"></div>

            <!-- Chat card: card-body holds the messages; d-flex flex-column stacks
                 the bubbles vertically; id="chatMessages" is used by the JavaScript. -->
            <div class="card">
                <div class="card-header bg-primary text-white fw-semibold">💬 Ask Me About the Restaurant</div>
                <div class="card-body d-flex flex-column" id="chatMessages" style="height: 480px; overflow-y: auto;">
                    <!-- Greeting bubble: align-self-start = on the LEFT (bot message) -->
                    <div class="message align-self-start bg-light rounded p-2 mb-2">Hello! 👋 I'm the ABC123 Restaurant Review Assistant.
Ask me anything about the restaurant's food, service, prices, or customer experiences.</div>
                </div>
                <div class="card-footer bg-white">
                    <!-- input-group = input + button sitting side by side -->
                    <div class="input-group">
                        <input type="text" class="form-control" id="userInput" placeholder="e.g., What do customers say about the laksa?" autocomplete="off">
                        <button class="btn btn-primary" id="sendBtn">Send</button>
                    </div>
                </div>
            </div>

            <footer class="text-center text-muted mt-4 small">Restaurant RAG Workshop | LangChain · Ollama · Qdrant</footer>
        </div>
    </div>
</div>

<!-- Floating menu button (FAB): the markup lives in ONE shared file
     (static/fab_menu.html). We just provide an empty container and fetch it,
     so every page shows the same menu without duplicating HTML.
     data-active tells the loader which menu item to highlight on this page. -->
<div id="fabContainer" data-active="chat"></div>
<script>
    fetch('/static/fab_menu.html')
        .then(r => r.text())
        .then(html => {
            document.getElementById('fabContainer').innerHTML = html;
            // Highlight this page's item (data-active = "chat" here).
            const page = document.getElementById('fabContainer').dataset.active;
            const link = document.querySelector('#fabContainer a[data-page="' + page + '"]');
            if (link) link.classList.add('active');
        });
</script>

<!-- Bootstrap's JavaScript: needed for the dropdown to work -->
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
<!-- marked: turns the bot's markdown (e.g. **bold**, lists) into HTML.
     DOMPurify: cleans that HTML so a malicious bot reply can't inject scripts. -->
<script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/dompurify/dist/purify.min.js"></script>
<script>
    // marked: "breaks: true" -> a single newline in the bot's reply becomes a line
    // break (Qwen writes short lines); "gfm: true" -> GitHub-flavoured markdown.
    marked.setOptions({ breaks: true, gfm: true });

    // --- DOM references -----------------------------------------------------------
    // We look up each HTML element ONCE and keep it in a variable, so we can reuse
    // it in many places instead of searching the page every time.
    const chatMessages = document.getElementById('chatMessages');
    const userInput = document.getElementById('userInput');
    const sendBtn = document.getElementById('sendBtn');
    const errorBanner = document.getElementById('errorBanner');
    let sending = false;  // true while we are waiting for the bot -> blocks double sends

    // --- addMessage: create one chat bubble ---------------------------------------
    // sender = 'user' -> right-aligned blue bubble (align-self-end, bg-primary)
    // sender = 'bot'  -> left-aligned light bubble (align-self-start, bg-light)
    function addMessage(text, sender, typing) {
        const div = document.createElement('div');  // create an empty <div>
        const align = sender === 'user' ? 'align-self-end' : 'align-self-start';
        const tone = sender === 'user' ? ' bg-primary text-white' : ' bg-light';
        div.className = 'message ' + align + tone + ' rounded p-2 mb-2';  // Bootstrap classes
        if (typing) div.classList.add('text-muted', 'fst-italic');  // grey italic "Thinking…"
        if (sender === 'bot' && !typing) {
            // Bot replies may contain markdown (**bold**, lists). marked converts it
            // to HTML, then DOMPurify strips anything unsafe BEFORE it touches the page
            // (the LLM output must never be injected raw).
            div.innerHTML = DOMPurify.sanitize(marked.parse(text));
        } else {
            div.textContent = text;  // textContent is SAFE: it cannot execute HTML
        }
        chatMessages.appendChild(div);  // add the bubble to the message list
        chatMessages.scrollTop = chatMessages.scrollHeight;  // scroll down to the newest message
        return div;  // give it back so the caller can remove it later
    }

    // --- showError: show the red error banner --------------------------------------
    function showError(msg) {
        errorBanner.textContent = '⚠️ ' + msg;
        errorBanner.classList.remove('d-none');  // remove "hidden" -> banner becomes visible
    }

    // --- sendMessage: the main flow when the user clicks Send / presses Enter ------
    async function sendMessage() {
        const text = userInput.value.trim();  // read the input, strip extra spaces
        if (!text || sending) return;         // ignore empty input / double clicks
        errorBanner.classList.add('d-none');  // hide any old error
        addMessage(text, 'user');             // show the question as a user bubble
        userInput.value = '';                 // clear the input box
        sending = true;
        sendBtn.disabled = true;              // disable the button while waiting

        const typingEl = addMessage('Thinking…', 'bot', true);  // "bot is typing" bubble
        try {
            // fetch() = the browser's way of calling a web API.
            // We POST JSON {"question": ...} to our FastAPI backend.
            const response = await fetch('/api/chat', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ question: text }),
            });
            const body = await response.json();  // parse the JSON reply
            if (!response.ok) throw new Error(typeof body.detail === 'string' ? body.detail : 'Server error');
            typingEl.remove();              // remove the "Thinking…" bubble
            addMessage(body.answer, 'bot'); // show the bot's real answer
        } catch (err) {
            // Anything went wrong (network, backend down, validation…) -> show a message.
            typingEl.remove();
            showError(err.message || 'Could not reach the chat backend.');
        } finally {
            // Runs no matter what: re-enable the button and give focus back to the input.
            sending = false;
            sendBtn.disabled = false;
            userInput.focus();
        }
    }

    // --- event listeners: wire up the UI -------------------------------------------
    // Click on the Send button -> sendMessage()
    sendBtn.addEventListener('click', sendMessage);
    // Press Enter inside the input -> sendMessage() (arrow function = short inline function)
    userInput.addEventListener('keypress', e => { if (e.key === 'Enter') sendMessage(); });
</script>
</body>
</html>
